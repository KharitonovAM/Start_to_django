{% extends 'blog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="container">
  <div class="row text-center">
    <a type="button" class="btn btn-lg btn-block" href="{% url 'blog:create_blog' %}">Добавить статью</a>
  </div>
</div>
  {% for info in object_list %}
    <div class="col-md-4">
          <div class="row g-0 border rounded overflow-hidden flex-md-row mb-4 shadow-sm h-md-250 position-relative">
            <div class="col p-4 d-flex flex-column position-static">
              <h3 class="mb-0">{{info.title}}</h3>
              <div class="mb-1 text-body-secondary">{{info.create_data}}</div>
              <p class="card-text mb-auto">{{info.content | truncatechars:150}}</p>
               <div class="mt-auto">
                 <a type="button" class="icon-link gap-1 icon-link-hover stretched-link" href="{% url 'blog:blog_detail' info.pk %}">Продолжить чтение</a>
               </div>
            </div>
            <div class="col-auto d-none d-lg-block">
              <img src="{{ info.preview | media_filter }}" style="width: 100%; height: 400px;">
            </div>
          </div>
        </div>
  {% endfor %}
{% endblock%}
