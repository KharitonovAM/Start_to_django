{% extends 'catalog/base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <form class="row" method="post" enctype="multipart/form-data">
            <div class="card">
                <div class="card-body>">
                    {% csrf_token %}
                    {{ form.as_p }}
                </div>

                <button type="submit" class="btn btn-primary">
                    {% if user.is_authenticated %}
                    Сохранить изменения
                    {% else %}
                    Зарегестрироваться
                    {% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
