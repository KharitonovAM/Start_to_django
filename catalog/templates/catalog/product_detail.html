{% extends 'catalog/base.html.' %}
{% load my_tags %}
{%block content%}
    <div class="container">
       <div class="row text-center row justify-content-center">
            <div class="col-4">
                <div class="card mb-4 box-shadow">
                    <div class="card-header bg-dark text-white">
                        <h4 class="my-0 font-weight-normal">{{ object.name.upper}}</h4>
                    </div>
                    <div class="card-body">
                        <h1 class="card-title pricing-card-title">{{ object.price }}</h1>
                        <ul class="list-unstyled mt-3 mb-4 text-start m-3 text-center">
                            <li><h2>{{ object.category }}</h2></li>
                        </ul>
                        <img src="{{object.image | media_filter}}" class="img-thumbnail" width="300" height="200"/>
                        <p>{{object.description}}</p>
                        <p>
                            <button type="button" class="btn btn-lg btn-block btn-outline-primary">Купить</button>
                            <a type="button" class="btn btn-lg btn-block btn-outline-primary" href="/">На главную</a>
                            <a type="button" class="btn btn-lg btn-block btn-outline-primary" href="{% url 'catalog:catalog_update' product.pk %}"}>Изменить</a>
                        </p>
                    </div>
                </div>
            </div>
       </div>
{% endblock %}
