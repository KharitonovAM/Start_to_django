{% extends 'catalog/base.html.' %}
{%block content%}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Контакты</h1>
</div>

<div class="container">
    <div class="row text-start">
        <div class="col-lg-9 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-body">
                    <table class="table table-striped">
                        <tr>
                            <td class="w-25">Страна</td>
                            <td>Российская Федерация</td>
                        </tr>
                        <tr>
                            <td class="w-25">ИНН</td>
                            <td>+7 999 777-77-77</td>
                        </tr>
                        <tr>
                            <td class="w-25">Адрес</td>
                            <td>Санкт-Петербург, Невский проспект д.70</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Свяжитесь с нами</h4>
                </div>
                <a class="card-body">
                    <form method="post" action="" class="form-floating">
                        <div class="mb-3">
                            <label for="name">Имя</label>
                            <input type="text" name="name" class="form-control" id="name" placeholder="Ваше имя" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone">Телефон</label>
                            <input type="text" name="phone" class="form-control" id="phone" placeholder="Контактный телефон" required>
                        </div>
                        <div class="mb-3">
                            <label for="message">Сообщение</label>
                            <textarea type="text" name="message" class="form-control" id="message" placeholder="Контактный телефон" required></textarea>
                        </div>
                        <a href="#" class="btn btn-lg btn-block btn-outline-primary" id="liveToastBtn"
                               data-toggle="modal"
                               tabindex="-1" role="button" aria-disabled="true">Отправить</a>
                        <div class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                          <div class="toast-header" id="liveToastBtn">
                            <img src="..." class="rounded me-2" alt="...">
                            <strong class="me-auto">Bootstrap</strong>
                            <small>11 mins ago</small>
                            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                          </div>
                          <div class="toast-body">
                            Hello, world! This is a toast message.
                          </div>
                        </div>



                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
